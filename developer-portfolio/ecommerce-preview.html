<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniCart — Sandbox</title><link rel="stylesheet" href="css/preview.css"></head><body><div class="wrap"><div class="top"><div><p class="kicker">SANDBOX • OMNICART</p><h1>Simple e-commerce interaction demo</h1></div><a href="index.html">← Portfolio</a></div><section class="panel"><p class="muted">Practice build. Not presented as client work.</p><div class="grid"><div class="card"><h3>Minimal Desk Lamp</h3><p class="muted">Modern product interface</p><button class="btn" onclick="add(49)">Add to cart — $49</button></div><div class="card"><h3>Mechanical Keyboard</h3><p class="muted">Developer workspace</p><button class="btn" onclick="add(89)">Add to cart — $89</button></div><div class="card"><h3>Monitor Stand</h3><p class="muted">Clean desk setup</p><button class="btn" onclick="add(39)">Add to cart — $39</button></div><div class="card wide"><h3>Cart</h3><p id="cart" class="muted">0 items</p><p class="price" id="total">$0.00</p><p class="muted">Tax is calculated at 5% for this demo.</p></div></div></section></div><script>let total=0,items=0;function add(p){items++;total+=p;document.querySelector("#cart").textContent=items+" item(s)";document.querySelector("#total").textContent="$"+(total*1.05).toFixed(2)}</script></body></html>
