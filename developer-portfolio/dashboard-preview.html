<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helix Dashboard — Sandbox</title><link rel="stylesheet" href="css/preview.css"></head><body><div class="wrap"><div class="top"><div><p class="kicker">SANDBOX • HELIX DASHBOARD</p><h1>Admin dashboard interaction demo</h1></div><a href="index.html">← Portfolio</a></div><section class="panel"><p class="muted">Practice build. Chart and task data are demo values.</p><div class="grid"><div class="card"><p class="muted">Active tasks</p><p class="price" id="count">4</p></div><div class="card wide"><p class="muted">Weekly activity</p><div class="chart" id="chart"></div></div><div class="card wide"><h3>Tasks</h3><div id="tasks"></div></div></div></section></div><script>const tasks=["Responsive QA","Dashboard cards","Form validation","Mobile navigation"];let done=new Set();const render=()=>{document.querySelector("#tasks").innerHTML=tasks.map((t,i)=>`<div class="task ${done.has(i)?"done":""}"><span>${t}</span><button class="btn" onclick="toggle(${i})">${done.has(i)?"Undo":"Complete"}</button></div>`).join("");document.querySelector("#count").textContent=tasks.length-done.size};function toggle(i){done.has(i)?done.delete(i):done.add(i);render()}render();document.querySelector("#chart").innerHTML=[35,70,52,88,62,95,76].map(v=>`<i class="bar" style="height:${v}%"></i>`).join("")</script></body></html>
